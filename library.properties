sentence=Board abstraction for the Waveshare ESP32-S3-Touch-AMOLED-2.06: shared mutex-protected I2C bus, pin map, buttons, and the PMIC rails that feed the audio, panel and vibration motor.
paragraph=Owns the board's one shared I2C bus (a thread-safe Wire wrapper so multiple FreeRTOS tasks and drivers can share it) on which the FT3168 touch controller, AXP2101 PMIC, PCF85063 RTC, QMI8658 IMU, ES8311 codec and ES7210 microphone ADC all sit. Writes down the whole pin map and I2C address map as named constants, reads the BOOT and PWR buttons, and switches the AXP2101 rails that exist only for board peripherals (audio analog, AMOLED power enable, vibration motor) plus the speaker amplifier. The display and power libraries depend on this. Self-contained: no external dependencies.
category=Device Control
url=https://github.com/chipguyhere/ESP32-S3-Touch-AMOLED-2.06_board
architectures=esp32
includes=AMOLED206_Board.h,AMOLED206_IMU.h,AMOLED206_OrientationWatch.h
depends=Wire
